<div class="bg-white border rounded-lg shadow-sm p-5 hover:shadow-md transition">
    <h3 class="text-xl font-semibold mb-2">{{ note().title }}</h3>

    <p class="text-gray-600 mb-3 line-clamp-3">{{ note().content }}</p>

    @if (note().summary) {
    <p class="text-sm text-gray-500 italic mb-3">"{{ note().summary }}"</p>
    }

    <div class="flex flex-wrap gap-2 mb-4">
        @for (tag of note().tags || []; track tag) {
        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full">
            {{ tag }}
        </span>
        }
    </div>

    <div class="flex justify-between text-sm text-gray-500 mt-4">
        <span>{{ note().updatedAt | date:'short' }}</span>

        <div class="space-x-3">
            <button (click)="edit.emit(note())" class="text-blue-600 hover:underline font-medium">
                Edit
            </button>

            <button (click)="summarize()" class="text-purple-600 hover:underline font-medium">
                Summarize
            </button>

            <button (click)="deleteNote()" class="text-red-600 hover:underline font-medium">
                Delete
            </button>
        </div>
    </div>
</div>
