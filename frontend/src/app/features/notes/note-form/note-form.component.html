<div class="p-6">
    <h2 class="text-2xl font-bold mb-6">
        {{ note ? 'Edit Note' : 'Create Note' }}
    </h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
        <!-- Title -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Title <span class="text-red-500">*</span>
            </label>
            <input formControlName="title" type="text"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="Enter note title..." />
            <p *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="mt-1 text-sm text-red-600">
                Title is required
            </p>
        </div>

        <!-- Content -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Content <span class="text-red-500">*</span>
            </label>
            <textarea formControlName="content" rows="10"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-y"
                placeholder="Write your note here..."></textarea>
            <p *ngIf="form.get('content')?.invalid && form.get('content')?.touched" class="mt-1 text-sm text-red-600">
                Content is required
            </p>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-4 pt-4 border-t mt-6">
            <button type="button" (click)="cancel.emit()"
                class="px-5 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                Cancel
            </button>

            <button type="submit" [disabled]="form.invalid || loading()"
                class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition">
                {{ loading() ? 'Saving...' : (note ? 'Update Note' : 'Create Note') }}
            </button>
        </div>
    </form>
</div>
